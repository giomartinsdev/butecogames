<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #141b34;
        --line: #2a3460;
        --text: #e7ecff;
        --muted: #aab3da;
        --win: #38d996;
        --danger: #ff5a7a;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        background: radial-gradient(1200px 800px at 50% -20%, #1b2a6b 0%, var(--bg) 55%);
        color: var(--text);
      }

      .wrap {
        width: min(520px, 92vw);
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 20px 70px rgba(0,0,0,0.45);
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 6px 14px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 0.4px;
      }

      .status {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 6px;
      }

      button.cell {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(20, 27, 52, 0.7);
        border-radius: 14px;
        height: min(120px, 26vw);
        cursor: pointer;
        font-size: min(56px, 12vw);
        font-weight: 800;
        color: var(--text);
        transition: transform 0.06s ease, border-color 0.2s ease, background 0.2s ease;
        display: grid;
        place-items: center;
        user-select: none;
      }

      button.cell:hover { border-color: rgba(255,255,255,0.22); }
      button.cell:active { transform: scale(0.985); }
      button.cell[disabled] { cursor: not-allowed; opacity: 0.92; }

      .cell.x { color: #7aa7ff; }
      .cell.o { color: #ffb36b; }

      .cell.win {
        border-color: rgba(56, 217, 150, 0.8);
        box-shadow: 0 0 0 2px rgba(56, 217, 150, 0.25) inset;
        background: rgba(56, 217, 150, 0.08);
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 6px 4px;
      }

      .score {
        display: flex;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
      }

      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.03);
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .btn {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.06s ease;
      }
      .btn:hover { border-color: rgba(255,255,255,0.26); background: rgba(255,255,255,0.08); }
      .btn:active { transform: scale(0.99); }

      .btn.danger {
        border-color: rgba(255,90,122,0.35);
        background: rgba(255,90,122,0.08);
      }

      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(231, 236, 255, 0.65);
        padding: 0 6px 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Tic Tac Toe</h1>
        <p class="status" id="status">Player X’s turn</p>
      </header>

      <div class="board" id="board" aria-label="Tic Tac Toe board"></div>

      <footer>
        <div class="score">
          <span class="pill" id="scoreX">X: 0</span>
          <span class="pill" id="scoreO">O: 0</span>
          <span class="pill" id="scoreD">Draws: 0</span>
        </div>
        <div class="actions">
          <button class="btn" id="restart">Restart round</button>
          <button class="btn danger" id="reset">Reset score</button>
        </div>
      </footer>

      <div class="hint">Tip: Click any cell. First to get 3 in a row wins.</div>
    </div>

    <script>
      // --- State ---
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const scoreXEl = document.getElementById("scoreX");
      const scoreOEl = document.getElementById("scoreO");
      const scoreDEl = document.getElementById("scoreD");
      const restartBtn = document.getElementById("restart");
      const resetBtn = document.getElementById("reset");

      let board = Array(9).fill(null); // "X" | "O" | null
      let current = "X";
      let gameOver = false;

      let score = { X: 0, O: 0, D: 0 };

      const wins = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      // --- UI helpers ---
      function renderBoard() {
        boardEl.innerHTML = "";
        board.forEach((val, idx) => {
          const btn = document.createElement("button");
          btn.className = "cell";
          btn.type = "button";
          btn.setAttribute("aria-label", `Cell ${idx + 1}`);
          btn.dataset.index = idx;
          btn.textContent = val ?? "";
          if (val === "X") btn.classList.add("x");
          if (val === "O") btn.classList.add("o");
          if (val || gameOver) btn.disabled = true;

          btn.addEventListener("click", onCellClick);
          boardEl.appendChild(btn);
        });
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function updateScoreUI() {
        scoreXEl.textContent = `X: ${score.X}`;
        scoreOEl.textContent = `O: ${score.O}`;
        scoreDEl.textContent = `Draws: ${score.D}`;
      }

      function highlightWin(line) {
        const cells = [...boardEl.querySelectorAll(".cell")];
        line.forEach((i) => cells[i].classList.add("win"));
      }

      // --- Game logic ---
      function checkWinner() {
        for (const line of wins) {
          const [a, b, c] = line;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return { winner: board[a], line };
          }
        }
        return null;
      }

      function isDraw() {
        return board.every((c) => c !== null);
      }

      function endGame(message, winLine = null) {
        gameOver = true;
        setStatus(message);
        // disable all remaining cells
        [...boardEl.querySelectorAll(".cell")].forEach((btn) => (btn.disabled = true));
        if (winLine) highlightWin(winLine);
      }

      function makeMove(index) {
        if (gameOver) return;
        if (board[index] !== null) return;

        board[index] = current;
        renderBoard();

        const result = checkWinner();
        if (result) {
          score[result.winner] += 1;
          updateScoreUI();
          endGame(`Player ${result.winner} wins!`, result.line);
          return;
        }

        if (isDraw()) {
          score.D += 1;
          updateScoreUI();
          endGame("It’s a draw!");
          return;
        }

        current = current === "X" ? "O" : "X";
        setStatus(`Player ${current}’s turn`);
      }

      function onCellClick(e) {
        const index = Number(e.currentTarget.dataset.index);
        makeMove(index);
      }

      function restartRound() {
        board = Array(9).fill(null);
        current = "X";
        gameOver = false;
        setStatus("Player X’s turn");
        renderBoard();
      }

      function resetScore() {
        score = { X: 0, O: 0, D: 0 };
        updateScoreUI();
        restartRound();
      }

      // --- init ---
      updateScoreUI();
      renderBoard();

      restartBtn.addEventListener("click", restartRound);
      resetBtn.addEventListener("click", resetScore);
    </script>
  </body>
</html>
