services:
  mongodb:
    image: mongo:7
    container_name: butecogames-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - butecogames
    restart: unless-stopped

  valkey:
    container_name: db-valkey
    image: valkey/valkey
    ports:
      - 6379:6379
    command: valkey-server --save 20 1 --loglevel warning --requirepass "123456"
    volumes:
      - valkey_data:/data
    networks:
      - butecogames
    restart: always

  butecogames-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: butecogames-server
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/butecogames
    depends_on:
      - mongodb
    networks:
      - butecogames
    restart: unless-stopped

  butecogames-client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: butecogames-client
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
      - VITE_WS_URL=${VITE_WS_URL:-http://localhost:3001}
      - BACKEND_HOST=${BACKEND_HOST:-butecogames-server:3001}
    depends_on:
      - butecogames-server
    networks:
      - butecogames
    restart: unless-stopped

volumes:
  mongodb_data:
  valkey_data:

networks:
  butecogames:

